[project]
name = "powercon-parts"
version = "0.1.0"
description = "3D-printable housings for Neutrik powerCON connectors, modelled with build123d"
requires-python = ">=3.12"
dependencies = [
    "build123d>=0.13.0",
    "numpy>=2.5.3",
    "pillow>=12.2.0",
]

[dependency-groups]
dev = [
    "ocp-vscode>=4.1.0",
]
